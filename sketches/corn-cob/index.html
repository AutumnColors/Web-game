<style>
/* Layout: full-bleed WebGL stage on sketch paper, hand-lettered label top-left, control strip bottom */
:root{
  --paper:#eef0ec; --paper-2:#dfe3dc; --ink:#25302b; --ink-soft:#5d6a63;
  --leaf:#2e8c7a; --wood:#b97f45; --chip:rgba(255,255,255,.72); --chip-line:rgba(37,48,43,.14);
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#201c19; --paper-2:#2c2622; --ink:#ece6dc; --ink-soft:#a89e92;
  --leaf:#6cc7b0; --wood:#d9a067; --chip:rgba(44,38,34,.78); --chip-line:rgba(236,230,220,.14); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#201c19; --paper-2:#2c2622; --ink:#ece6dc; --ink-soft:#a89e92;
  --leaf:#6cc7b0; --wood:#d9a067; --chip:rgba(44,38,34,.78); --chip-line:rgba(236,230,220,.14); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 40%, var(--paper) 0%, var(--paper-2) 100%) var(--paper);
  color:var(--ink);font-family:var(--f-ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage canvas:active{cursor:grabbing}
.label{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.label h1{font-family:var(--f-hand);font-weight:600;font-size:2.4rem;line-height:1;margin:0;color:var(--ink);text-wrap:balance}
.back{pointer-events:auto;display:inline-block;margin-bottom:.4rem;font-size:.85rem;color:var(--ink-soft);text-decoration:none}
.back:hover,.back:focus-visible{color:var(--ink);text-decoration:underline}
.label p{margin:.35rem 0 0;font-size:.8rem;color:var(--ink-soft);letter-spacing:.02em}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--chip);border:1px solid var(--chip-line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar button{font:500 .85rem var(--f-ui);color:var(--ink);background:transparent;border:0;border-radius:999px;padding:.55rem .95rem;cursor:pointer;white-space:nowrap}
.bar button:hover{background:var(--chip-line)}
.bar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bar button:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.sketch{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));
  width:min(130px,28vw);margin:0;padding:6px 6px 4px;background:#fff;border-radius:4px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);transform:rotate(2.5deg);transition:opacity .25s,transform .25s}
.sketch img{display:block;width:100%;border-radius:2px}
.sketch figcaption{font:600 1rem var(--f-hand);color:#4a4540;text-align:center;padding-top:2px}
.sketch[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.sketch{transition:none}}
</style>
</head>

<script>
(function(){
const V3=THREE.Vector3;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.95;
renderer.setClearColor(0x000000,0);
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,0.1,100);
const HOME_POS=new V3(3.6,3.0,15.6), HOME_TGT=new V3(0,1.0,0);
camera.position.copy(HOME_POS);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.enablePan=false; controls.minDistance=5; controls.maxDistance=24;
controls.autoRotate=true; controls.autoRotateSpeed=1.4;

// lights
scene.add(new THREE.HemisphereLight(0xfffbf0,0x6b5a48,0.85));
const key=new THREE.DirectionalLight(0xfff4e2,1.25); key.position.set(5,8,6); scene.add(key);
const rim=new THREE.DirectionalLight(0xcfe8ff,0.55); rim.position.set(-6,3,-5); scene.add(rim);

// seeded random
let seed=11; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const lin=h=>new THREE.Color(h).convertSRGBToLinear();

// ---------- cob ----------
const YB=-0.7, YT=4.3, RMAX=0.72;
function cobR(y){
  const u=(y-YB)/(YT-YB); if(u<0||u>1) return 0;
  return RMAX*(1-0.58*u*u)*Math.sqrt(Math.min(1,u*9))*Math.sqrt(Math.min(1,(1-u)*14+0.15));
}
const lathe=[];
for(let i=0;i<=60;i++){const y=YB+(YT-YB)*i/60;lathe.push(new THREE.Vector2(Math.max(0.001,cobR(y)*0.93),y));}
lathe.push(new THREE.Vector2(0.001,YT+0.03));
scene.add(new THREE.Mesh(new THREE.LatheGeometry(lathe,48),new THREE.MeshStandardMaterial({color:0xc08a2e,roughness:0.85})));

// kernels: straight rows around the cob, smaller toward the tip
const ROWS=16, kernels=[];
for(let row=0;row<ROWS;row++){
  const th0=row/ROWS*Math.PI*2;
  let y=YB+0.1;
  while(y<YT-0.06){
    const r=cobR(y);
    const step=0.09+0.08*(r/RMAX);
    if(r>0.1) kernels.push({th:th0+(rnd()-.5)*0.03,y:y+step/2,r,step});
    y+=step;
  }
}
const kMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(1,12,8),new THREE.MeshStandardMaterial({roughness:0.42,metalness:0}),kernels.length);
const m=new THREE.Matrix4(), kc=new THREE.Color();
const kA=lin('#f2c54c'), kB=lin('#fae28f'), kTop=lin('#e6a63a');
kernels.forEach((k,i)=>{
  const c=Math.cos(k.th), s=Math.sin(k.th);
  const radial=new V3(c,0,s), tang=new V3(-s,0,c), up=new V3(0,1,0);
  const sx=Math.PI*k.r/ROWS*0.92, sy=k.step*0.47, sz=0.06+0.03*(k.r/RMAX);
  m.makeBasis(tang.clone().multiplyScalar(sx),up.clone().multiplyScalar(sy),radial.clone().multiplyScalar(sz));
  m.setPosition(c*k.r*0.97,k.y,s*k.r*0.97);
  kMesh.setMatrixAt(i,m);
  const u=(k.y-YB)/(YT-YB);
  kc.copy(kA).lerp(kB,rnd()*0.65).lerp(kTop,Math.pow(u,3)*0.7);
  kMesh.setColorAt(i,kc);
});
scene.add(kMesh);

// silk: fine wisps from the tip
const silkPts=[];
for(let i=0;i<80;i++){
  const th=rnd()*Math.PI*2, spread=0.25+rnd()*0.6;
  let p=new V3(Math.cos(th)*0.1,YT-0.05,Math.sin(th)*0.1);
  const dir=new V3(Math.cos(th)*spread,1,Math.sin(th)*spread).normalize();
  const segs=6+Math.floor(rnd()*6);
  for(let j=0;j<segs;j++){
    const q=p.clone().addScaledVector(dir,0.07+rnd()*0.03).add(new V3((rnd()-.5)*0.05,(rnd()-.5)*0.02,(rnd()-.5)*0.05));
    silkPts.push(p.x,p.y,p.z,q.x,q.y,q.z);p=q;
    dir.x+=(rnd()-.5)*0.25;dir.z+=(rnd()-.5)*0.25;dir.y-=0.04;dir.normalize();
  }
}
const silkGeo=new THREE.BufferGeometry();silkGeo.setAttribute('position',new THREE.Float32BufferAttribute(silkPts,3));
scene.add(new THREE.LineSegments(silkGeo,new THREE.LineBasicMaterial({color:0xc99a5c,transparent:true,opacity:0.8})));

// ---------- husk ----------
const YS=-2.55;
const hPale=lin('#cde3bd'), hPale2=lin('#8fc293'), hTeal=lin('#2f8a73'), hDeep=lin('#1f6a5a'), hTip=lin('#e8d75a');
const HP=[],HC=[],HI=[];
function addHusk(o){
  const NS=40, NC=12, ds=o.L/NS, base=HP.length/3;
  let rho=0.07, y=YS;
  const line=[];
  for(let i=0;i<=NS;i++){
    const t=i/NS;
    if(i>0){
      const a=o.a0*(1-smooth(0,0.38,t))-o.inward*smooth(0.38,1,t)+(o.curl?o.curl*smooth(o.t0,o.t0+0.42,t):0);
      rho+=Math.sin(a)*ds; y+=Math.cos(a)*ds;
      if(t<o.t0+0.05) rho=Math.max(rho,cobR(y)+0.05+o.layer*0.045);
      rho=Math.max(rho,0.06);
    }
    line.push([rho,y]);
  }
  for(let i=0;i<=NS;i++){
    const t=i/NS, [r,yy]=line[i];
    const w=o.W*Math.pow(Math.sin(Math.PI*Math.pow(t,0.78)),0.8);
    const half=Math.min(1.45,w/Math.max(r,0.12));
    for(let j=0;j<=NC;j++){
      const sN=j/NC*2-1, e=Math.abs(sN);
      const th=o.th+sN*half+o.twist*t*t;
      const rr=r+0.035*(1-sN*sN)*Math.sin(Math.PI*t);
      HP.push(Math.cos(th)*rr,yy,Math.sin(th)*rr);
      const col=hPale.clone().lerp(hPale2,o.teal*0.6);
      col.lerp(hTeal,Math.min(1,smooth(0.35,1,e)*0.85+o.teal*0.45*smooth(0.05,0.3,t)*(1-smooth(0.5,0.8,t))));
      if(o.teal>0.6) col.lerp(hDeep,0.45*e+0.15);
      if(o.tip&&t>0.82) col.lerp(hTip,smooth(0.82,1,t)*0.85);
      if(t<0.06) col.lerp(hTeal,0.4);
      HC.push(col.r,col.g,col.b);
    }
  }
  const S=NC+1;
  for(let i=0;i<NS;i++)for(let j=0;j<NC;j++){
    const a=base+i*S+j,b=a+S,c=a+1,d=b+1;HI.push(a,b,c,b,d,c);
  }
}
const D=Math.PI/180;
[
  {th:200,L:6.7,W:1.25,a0:0.95,inward:0.12,t0:1,curl:0,layer:0,teal:0.85,twist:0},
  {th:340,L:5.9,W:1.2, a0:0.95,inward:0.10,t0:1,curl:0,layer:0,teal:0.85,twist:0},
  {th:270,L:5.3,W:1.0, a0:0.95,inward:0.10,t0:1,curl:0,layer:0,teal:0.9, twist:0},
  {th:20, L:5.5,W:0.8, a0:0.95,inward:0.20,t0:1,curl:0,layer:1,teal:0.6, twist:0.15},
  {th:165,L:5.0,W:0.8, a0:0.95,inward:0.20,t0:1,curl:0,layer:1,teal:0.5, twist:-0.1},
  {th:132,L:6.4,W:0.85,a0:0.95,inward:0.05,t0:0.56,curl:2.3,layer:2,teal:0.25,twist:0.25,tip:1},
  {th:52, L:6.8,W:0.9, a0:0.95,inward:0.05,t0:0.50,curl:2.1,layer:2,teal:0.25,twist:-0.2,tip:1},
  {th:95, L:3.7,W:1.05,a0:0.95,inward:0.35,t0:1,curl:0,layer:3,teal:0.55,twist:0}
].forEach(o=>{o.th*=D;addHusk(o);});
const huskGeo=new THREE.BufferGeometry();
huskGeo.setAttribute('position',new THREE.Float32BufferAttribute(HP,3));
huskGeo.setAttribute('color',new THREE.Float32BufferAttribute(HC,3));
huskGeo.setIndex(HI);huskGeo.computeVertexNormals();
scene.add(new THREE.Mesh(huskGeo,new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:0.75})));

// stem nub
const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.12,0.4,24),new THREE.MeshStandardMaterial({color:0x9fb36a,roughness:.8}));
stem.position.set(0,YS-0.12,0);scene.add(stem);
const stemEnd=new THREE.Mesh(new THREE.CircleGeometry(0.12,24),new THREE.MeshStandardMaterial({color:0xb07a3e,roughness:.9,side:THREE.DoubleSide}));
stemEnd.rotation.x=Math.PI/2;stemEnd.position.set(0,YS-0.32,0);scene.add(stemEnd);

// ---------- soft floor shadow ----------
const sc=document.createElement('canvas');sc.width=sc.height=128;const sg=sc.getContext('2d');
const rg=sg.createRadialGradient(64,64,0,64,64,64);rg.addColorStop(0,'rgba(0,0,0,.3)');rg.addColorStop(1,'rgba(0,0,0,0)');
sg.fillStyle=rg;sg.fillRect(0,0,128,128);
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(4.4,4.4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;shadow.position.set(0,-3.3,0);scene.add(shadow);

// ---------- sizing & loop ----------
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);
  camera.aspect=w/h;
  // keep the whole object in frame on narrow screens
  camera.fov=w/h<0.75?48:35;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);resize();

const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const spinBtn=document.getElementById('spin');
function setSpin(on){controls.autoRotate=on;spinBtn.setAttribute('aria-pressed',String(on));}
if(reduce) setSpin(false);
spinBtn.onclick=()=>setSpin(!controls.autoRotate);
controls.addEventListener('start',()=>setSpin(false));
document.getElementById('reset').onclick=()=>{camera.position.copy(HOME_POS);controls.target.copy(HOME_TGT);controls.update();};
const sk=document.getElementById('sketch'),skBtn=document.getElementById('showSketch');
skBtn.onclick=()=>{sk.hidden=!sk.hidden;skBtn.setAttribute('aria-pressed',String(!sk.hidden));};

(function loop(){controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);})();
})();
</script>
</body>
</html>
