<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Games</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--card:#141e30;--card2:#1b2840;--line:#2a3a55;--text:#eef3fa;--muted:#93a4bd;--accent:#79d4ff;--done:#81e9a1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#172a45 0%,var(--bg) 62%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 56px}
h1{font-size:clamp(2rem,7vw,3rem);margin:0 0 6px;letter-spacing:.02em}
.sec{font-size:1.4rem;margin:40px 0 4px;letter-spacing:.02em}
.sub{color:var(--muted);margin:0 0 28px}
.sec+.sub{margin-bottom:16px}
.subsec{font-size:1.15rem;margin-top:28px;color:var(--accent)}
.levels{display:grid;gap:12px;list-style:none;padding:0;margin:0}
.level{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--card);border:2px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;transition:transform .12s,border-color .12s,background .12s}
.level:hover,.level:focus-visible{border-color:var(--accent);background:var(--card2);transform:translateY(-2px);outline:none}
.num{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.2rem;background:#0e1626;border:2px solid var(--line);font-variant-numeric:tabular-nums}
.num.badge{font-size:.85rem;color:var(--accent)}
.level.done .num{border-color:var(--done);color:var(--done)}
.info{min-width:0;flex:1}
.title{font-weight:750;font-size:1.1rem}
.meta{flex:none;text-align:right;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .ok{color:var(--done);font-weight:700}
.foot{margin-top:28px;text-align:center}
.reset{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;text-decoration:underline}
@media(max-width:480px){main{padding:22px 12px 40px}.level{gap:12px;padding:14px}.num{width:40px;height:40px;font-size:1rem}.num.badge{font-size:.75rem}}
</style>
</head>
<body>
<main>
  <h1>Games & Labs</h1><p class="sub">Latest GitHub HTML updates first.</p><p class="sub" id="status">Loading timestamps…</p><ol class="levels" id="recent"></ol>
  <div class="foot"><button class="reset" id="reset" type="button">Reset progress</button></div>
</main>
<script src="shared/progress.js"></script>
<script src="levels.js"></script>
<script src="explore.js"></script>
<script src="groups.js"></script>
<script src="world.js"></script>
<script src="sketches.js"></script>
<script src="music.js"></script>
<script src="research.js"></script>
<script>
'use strict';
const repo='AutumnColors/Web-game',cacheKey='html-dates-v1';
function items(){
const p=GameKit.get(),out=[];
function add(arr,category){(arr||[]).forEach((x,i)=>out.push({path:x.path,title:x.title,badge:x.badge||String(i+1),category,done:category==='Games'&&!!p[x.id]?.completed}));}
add(window.LEVELS,'Games');add(window.EXPLORE,'Explore');add(window.GROUPS,'Groups');
(window.WORLD_LAYERS||[]).forEach(x=>out.push({path:'world/#layer='+x.id,title:x.title,badge:x.badge,category:'World'}));
add(window.SKETCHES,'Sketches');add(window.RESEARCH,'Research');add(window.MUSIC,'Music');
out.push({path:'explore/boundary-lab/',title:'Boundary Lab',badge:'≈',category:'Explore'});
out.push({path:'boundary-wave-lab.html',title:'Circular Boundary Wave Lab',badge:'◯',category:'Explore'});
return out;
}
function htmlPath(p){p=p.split('#')[0].split('?')[0];return p.endsWith('/')?p+'index.html':p;}
function draw(arr){
const list=document.getElementById('recent');list.replaceChildren();
arr.forEach(e=>{
const li=document.createElement('li'),a=document.createElement('a');a.href=e.path;a.className='level'+(e.done?' done':'');
const num=document.createElement('span');num.className='num badge';num.textContent=e.badge||'•';
const info=document.createElement('span');info.className='info';
const title=document.createElement('div');title.className='title';title.textContent=e.title;
const category=document.createElement('small');category.textContent=e.category;info.append(title,category);
const meta=document.createElement('span');meta.className='meta';meta.textContent=e.date?new Date(e.date).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'—';
if(e.done){const ok=document.createElement('div');ok.className='ok';ok.textContent='✓ Cleared';meta.append(ok)}
a.append(num,info,meta);li.append(a);list.append(li);
});
}
async function render(){
const arr=items();draw(arr);let cache={};
try{const v=JSON.parse(localStorage.getItem(cacheKey)||'{}');if(Date.now()-v.time<43200000)cache=v.dates||{}}catch{}
const paths=[...new Set(arr.map(e=>htmlPath(e.path)))],missing=paths.filter(p=>!(p in cache));
let index=0,failed=0;
async function worker(){while(index<missing.length){const path=missing[index++];
try{const url='https://api.github.com/repos/'+repo+'/commits?sha=main&per_page=1&path='+encodeURIComponent(path);
const response=await fetch(url,{headers:{Accept:'application/vnd.github+json'}});
if(!response.ok)throw Error(response.status);
const commits=await response.json();cache[path]=commits[0]?.commit?.committer?.date||null;
}catch{failed++}
}}
await Promise.all([worker(),worker(),worker()]);
try{localStorage.setItem(cacheKey,JSON.stringify({time:failed?0:Date.now(),dates:cache}))}catch{}
arr.forEach(e=>e.date=cache[htmlPath(e.path)]||null);
arr.sort((a,b)=>(Date.parse(b.date)||0)-(Date.parse(a.date)||0)||a.title.localeCompare(b.title));
draw(arr);
document.getElementById('status').textContent=failed?'Sorted by available dates; GitHub rate limits prevented some timestamps.':'Sorted by latest HTML commit on main · newest first';
}
document.getElementById('reset').addEventListener('click',()=>{if(!confirm('Reset all progress?'))return;try{localStorage.removeItem(GameKit.key)}catch{}render()});
window.addEventListener('pageshow',render);render();
</script>
</body>
</html>
