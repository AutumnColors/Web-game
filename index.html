<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Games & Labs · Latest Updates</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--card:#141e30;--card2:#1b2840;--line:#2a3a55;--text:#eef3fa;--muted:#93a4bd;--accent:#79d4ff;--done:#81e9a1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#172a45 0%,var(--bg) 62%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 56px}
h1{font-size:clamp(2rem,7vw,3rem);margin:0 0 6px;letter-spacing:.02em}
.sec{font-size:1.4rem;margin:40px 0 4px;letter-spacing:.02em}
.sub{color:var(--muted);margin:0 0 28px}
.sec+.sub{margin-bottom:16px}
.subsec{font-size:1.15rem;margin-top:28px;color:var(--accent)}
.levels{display:grid;gap:12px;list-style:none;padding:0;margin:0}
.level{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--card);border:2px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;transition:transform .12s,border-color .12s,background .12s}
.level:hover,.level:focus-visible{border-color:var(--accent);background:var(--card2);transform:translateY(-2px);outline:none}
.num{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.2rem;background:#0e1626;border:2px solid var(--line);font-variant-numeric:tabular-nums}
.num.badge{font-size:.85rem;color:var(--accent)}
.level.done .num{border-color:var(--done);color:var(--done)}
.info{min-width:0;flex:1}
.title{font-weight:750;font-size:1.1rem}
.meta{flex:none;text-align:right;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .ok{color:var(--done);font-weight:700}
.pinned-label{display:inline-block;color:var(--accent);font-weight:700;font-size:.75rem;margin-bottom:4px}
.detail{color:var(--muted);font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:440px;margin-top:3px}
.foot{margin-top:28px;text-align:center}
.reset{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;text-decoration:underline}
@media(max-width:480px){main{padding:22px 12px 40px}.level{gap:12px;padding:14px}.num{width:40px;height:40px;font-size:1rem}.num.badge{font-size:.75rem}}
</style>
</head>
<body>
<main>
  <h1>Games & Labs</h1><p class="sub">All app entry points, newest updates first. Automatically refreshed from GitHub.</p><p class="sub" id="status">Loading app catalog…</p><ol class="levels" id="recent"></ol>
  <div class="foot"><button class="reset" id="reset" type="button">Reset progress</button></div>
</main>
<script src="shared/progress.js"></script>
<script src="levels.js"></script>
<script src="explore.js"></script>
<script src="groups.js"></script>
<script src="world.js"></script>
<script src="sketches.js"></script>
<script src="music.js"></script>
<script src="research.js"></script>
<script>
'use strict';
const catalogUrl='app-catalog.json';
// Keep pinned apps here; the generated catalog remains fully automatic.
const pinnedPaths=['explore/stopping-lab/'];
// Hide retired experiments even if an older cached catalog is served.
const removedPaths=new Set(['explore/fractal-atlas/terrain.html','explore/fractal-geography/','explore/dual-reconstruction-lab/','explore/fractal-lab/doubling-test.html','explore/fractal-lab/geometry-discovery.html','explore/fractal-lab/surface.html','explore/fractal-lab/wave-aligned.html','explore/polar-expedition/']);
function fallbackItems(){
  const p=GameKit.get(),out=[];
  function add(arr,category){(arr||[]).forEach((x,i)=>out.push({path:x.path,title:x.title,badge:x.badge||String(i+1),category,done:category==='Games'&&!!p[x.id]?.completed}));}
  add(window.LEVELS,'Games');add(window.EXPLORE,'Explore');add(window.GROUPS,'Groups');
  (window.WORLD_LAYERS||[]).forEach(x=>out.push({path:'world/#layer='+x.id,title:x.title,badge:x.badge,category:'World'}));
  add(window.SKETCHES,'Sketches');add(window.RESEARCH,'Research');add(window.MUSIC,'Music');
  out.push({path:'explore/boundary-lab/',title:'Boundary Lab',badge:'≈',category:'Explore'});
  out.push({path:'boundary-wave-lab.html',title:'Circular Boundary Wave Lab',badge:'◯',category:'Explore'});
  return out;
}
function draw(arr){
  const list=document.getElementById('recent');list.replaceChildren();
  arr.forEach(e=>{
    const li=document.createElement('li'),a=document.createElement('a');
    a.href=e.path;a.className='level'+(e.done?' done':'');
    const num=document.createElement('span');num.className='num badge';num.textContent=e.pinned?'★':(e.badge||'↗');
    const info=document.createElement('span');info.className='info';
    const title=document.createElement('div');title.className='title';title.textContent=e.title;
    const category=document.createElement('small');category.textContent=e.category||'App';
    const detail=document.createElement('div');detail.className='detail';
    if(e.update){detail.textContent=e.update;detail.title=e.update;}
    if(e.pinned){const pinned=document.createElement('small');pinned.className='pinned-label';pinned.textContent='★ Pinned';info.append(pinned);}
    info.append(title,category,detail);
    const meta=document.createElement('span');meta.className='meta';
    const stamp=e.date?new Date(e.date):null;
    meta.textContent=stamp&&!Number.isNaN(stamp.getTime())?stamp.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'—';
    if(e.done){const ok=document.createElement('div');ok.className='ok';ok.textContent='✓ Cleared';meta.append(ok)}
    a.append(num,info,meta);li.append(a);list.append(li);
  });
}
async function render(){
  const status=document.getElementById('status');
  let arr;
  try{
    const response=await fetch(catalogUrl+'?t='+Math.floor(Date.now()/300000),{cache:'no-cache'});
    if(!response.ok)throw Error('Catalog not published');
    const catalog=await response.json();
    if(!Array.isArray(catalog.apps)||!catalog.apps.length)throw Error('Empty catalog');
    const completed=GameKit.get();
    const progress=new Map((window.LEVELS||[]).map(x=>[x.path,!!completed[x.id]?.completed]));
    arr=catalog.apps.map(e=>({...e,done:progress.get(e.path)||false}));
    status.textContent='Auto-discovered from main · updated '+new Date(catalog.generatedAt).toLocaleString();
  }catch(err){
    arr=fallbackItems();
    status.textContent='Showing the existing app list until the automatic catalog is generated.';
  }
  arr=arr.filter(e=>!removedPaths.has(e.path)&&!e.path.startsWith('legacy/'));
  arr.forEach(e=>e.pinned=pinnedPaths.includes(e.path));
  arr.sort((a,b)=>Number(b.pinned)-Number(a.pinned)||(Date.parse(b.date)||0)-(Date.parse(a.date)||0)||a.title.localeCompare(b.title));
  draw(arr);
}
document.getElementById('reset').addEventListener('click',()=>{if(!confirm('Reset all progress?'))return;try{localStorage.removeItem(GameKit.key)}catch{}render()});
window.addEventListener('pageshow',render);render();
</script>
<footer style="text-align:center;padding:22px"><a href="legacy/" style="color:#91baff">Legacy experiments archive</a></footer><script src="site-chrome.js" defer></script></body>
</html>
