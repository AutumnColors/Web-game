<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Six routes through the Mandelbrot set</title>
<style>
:root{--bg:#0b0d12;--panel:#141821;--line:#262c3a;--text:#e8ebf2;--mute:#8b93a7;--acc:#ffb35c;--ok:#9be7a8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto}
header{display:flex;align-items:baseline;gap:12px;padding:10px 14px 2px}
header a{color:var(--mute);text-decoration:none;font-size:14px;white-space:nowrap}
header h1{font-size:16px;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:13px system-ui}
.tabs button.on{color:#0b0d12;background:var(--acc);border-color:var(--acc);font-weight:650}
.stage{position:relative;flex:1 1 auto;min-height:0;touch-action:pan-y}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .res{position:absolute;inset:0;overflow:auto;padding:4px 14px 14px;background:var(--bg)}
.tap{position:absolute;top:0;bottom:0;width:30%;z-index:2}.tap.l{left:0}.tap.r{right:0}
.live{position:absolute;right:10px;top:6px;z-index:3;font:11px ui-monospace,Menlo,monospace;color:var(--mute);background:rgba(11,13,18,.7);padding:3px 7px;border-radius:8px}
.cap{padding:8px 14px 2px;min-height:92px}
.cap b{display:block;font-size:16px;margin-bottom:2px;color:var(--acc)}
.cap p{margin:0}
.foot{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 14px}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}
.n{color:var(--mute);font:12px ui-monospace,Menlo,monospace}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th,td{border:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
th{background:var(--panel);color:var(--mute);font-weight:600}
td.k{color:var(--acc);font-weight:650;white-space:nowrap}
.res h2{font-size:17px;margin:6px 0 4px}.res p{color:var(--mute);margin:8px 0}
.ok{color:#9be7a8}.no{color:#ff8a7a}
</style></head><body>

const ROUTES=[{"title":"Fibonacci road","results":"<h2>Fibonacci road</h2>\n<table><tr><th>Period</th><th>Jump per step</th><th>Bulb diameter</th><th>Shrink from previous</th></tr><tr><td class=k>2</td><td>1</td><td>0.5</td><td></td></tr><tr><td class=k>3</td><td>1</td><td>0.1887</td><td>2.650</td></tr><tr><td class=k>5</td><td>2</td><td>0.07748</td><td>2.436</td></tr><tr><td class=k>8</td><td>3</td><td>0.03063</td><td>2.530</td></tr><tr><td class=k>13</td><td>5</td><td>0.01215</td><td>2.520</td></tr><tr><td class=k>21</td><td>8</td><td>0.004739</td><td>2.564</td></tr><tr><td class=k>34</td><td>13</td><td>0.001836</td><td>2.581</td></tr><tr><td class=k>55</td><td>21</td><td>0.0007065</td><td>2.599</td></tr></table>\n<p><b class=ok>Found:</b> after a wobbly start, from period 13 on the shrink factor climbs 2.52 → 2.56 → 2.58 → 2.60, heading for φ² = 2.618. It approaches from below and slowly.</p>\n<p><b class=ok>Found:</b> the jump inside each loop is itself a Fibonacci number (1, 1, 2, 3, 5, 8, 13, 21). A 13-note loop jumps 5 places per step.</p>\n<p><b class=ok>Checked:</b> every period was verified by running the orbit; antenna spokes counted 5 and 8 on the close-ups.</p>\n<p>Open: the road ends at the golden point −0.3905 + 0.5868i, which no bulb ever reaches.</p>","frames":[{"spec":{"t":"m","cx":-0.55,"cy":0.52,"w":1.55,"maxit":2016,"rot":0.0,"ov":[{"k":"ring","x":151.0,"y":721.5,"r":151.0,"text":"2","size":30},{"k":"ring","x":558.6,"y":375.5,"r":57.0,"text":"3","size":30},{"k":"ring","x":381.2,"y":460.1,"r":23.4,"text":"5","size":30},{"k":"dot","x":434.1,"y":449.0,"r":6,"col":"#78ffa0","edge":false},{"k":"text","x":374.1,"y":415.0,"text":"8, 13, 21… → golden point","size":20}]},"title":"The road","cap":"Bulbs of period 2, 3, 5, 8, 13 lie on one road around the main body. The green dot is where the road ends: the golden point, −0.3905 + 0.5868i."},{"spec":{"t":"m","cx":-0.39054087021840006,"cy":0.5867879073469687,"w":0.372182773008378,"maxit":2028,"rot":0.0,"ov" :513.6,"y":315.6,"r":111.3,"text":"55","size":30},{"k":"dot","x":360.0,"y":480.0,"r":5,"col":"#78ffa0","edge":false}]},"title":"Period 55","cap":"Zoom ×1,077 toward the golden point. Bulb 21/55: its loop has 55 notes and jumps 21 places each step. Diameter 0.000706."},{"spec":{"t":"m","cx":-0.552319593333251,"cy":0.6288424461218141,"w":0.15496407538893728,"maxit":2032,"rot":0.0,"ov":[]},"title":"Antenna of the 5-bulb","cap":"Count the spokes where the antenna branches: there are 5. The number of spokes always equals the bulb's period."},{"spec":{"t":"m","cx":-0.37090579092687287,"cy":0.6477436270342781,"w":0.06125927795286042,"maxit":2044,"rot":0.0,"ov":[]},"title":"Antenna of the 8-bulb","cap":"Count the spokes where the antenna branches: there are 8. The number of spokes always equals the bulb's period."}]},{"title":"Farey grammar","results":"<h2>Farey grammar</h2>\n<table><tr><th>Period</th><th>Bulb</th><th>Jump</th><th>Diameter</th></tr><tr><td class=k>3</td><td>1/3</td><td>1</td><td>0.1887</td></tr><tr><td class=k>4</td><td>1/4</td><td>1</td><td>0.08765</td></tr><tr><td class=k>7</td><td>2/7</td><td>2</td><td>0.03348</td></tr><tr><td class=k>10</td><td>3/10</td><td>3</td><td>0.01737</td></tr><tr><td class=k>11</td><td>3/11</td><td>3</td><td>0.01355</td></tr></table>\n<p><b class=ok>Confirmed:</b> of the 6 bulbs between period 3 and period 4 (up to period 16), the biggest is period 3 + 4 = 7. The next two are 10 = 3 + 7 and 11 = 7 + 4.</p>\n<table><tr><th>Biggest between 3 and 4</th><th>Diameter</th></tr><tr><td class=k>2/7</td><td>0.03348</td></tr><tr><td class=k>3/10</td><td>0.01737</td></tr><tr><td class=k>3/11</td><td>0.01355</td></tr><tr><td class=k>4/13</td><td>0.01053</td></tr><tr><td class=k>4/15</td><td>0.007228</td></tr><tr><td class=k>5/16</td><td>0.007021</td></tr></table>\n<p><b class=ok>Seen:</b> the 7-loop visits its notes in the order 1 → 5 → 2 → 6 → 3 → 7 → 4 around the centre: always 2 places on.</p>\n<p>Open: whether a 7-note loop sounds like 3 and 4 combined is a question for your ears, not for the math.</p>","frames":[{"spec":{"t":"m","cx":0.09,"cy":0.64,"w":0.62,"maxit":2020,"rot":0.0,"ov":[{"k":"ring","x":113.2,"y":358.2,"r":142.4,"text":"3","size":28},{"k":"ring","x":583.3,"y":607.7,"r":66.2,"text":"4","size":28},{"k":"ring","x":396.2,"y":514.1,"r":25.3,"text":"7","size":28},{"k":"ring","x":313.9,"y":491.1,"r":13.1,"text":"10","size":22},{"k":"ring","x":455.6,"y":560.4,"r":10.2,"text":"11","size":22}]},"title":"Two parents, one child","cap":"Bulb 3 (top left) and bulb 4 (right). The biggest bulb between them has period 3 + 4 = 7. Between 3 and 7 sits 10; between 7 and 4 sits 11."},{"spec":{"t":"m","cx":0.14112362643149354,"cy":0.6511774277870592,"w":0.10713490115664491,"maxit":2032,"rot":0.0,"ov":[]},"title":"Seven spokes","cap":"The 7-bulb's antenna branches into 7 spokes. Its loop has 7 notes."},{"spec":{"t":"j","jr":-0.12256116687665362,"ji":0.7448617666197442,"cx":0,"cy":0,"w":2.5,"maxit":2000,"rot":0.0,"ov":[{"k":"dot","x":324.7,"y":265.5,"r":7,"col":"#78ffa0"},{"k":"text","x":326.7,"y":247.5,"text":"1","size":24},{"k":"dot","x":169.2,"y":318.1,"r":7,"col":"#78ffa0"},{"k":"text","x":171.2,"y":300.1,"text":"2","size":24},{"k":"dot","x":360.0,"y":480.0,"r":7,"col":"#78ffa0"},{"k":"text","x":362.0,"y":462.0,"text":"3","size":24}]},"title":"The 3-loop","cap":"The loop for this bulb, drawn in its own world (its Julia set). Green dots = the 3 notes, numbered by when the orbit visits them. Around the circle each step jumps 1 place: positions 2 3 1."},{"spec":{"t":"j","jr":0.2822713907669139,"ji":0.5300606175785253,"cx":0,"cy":0,"w":2.5,"maxit":2000,"rot":0.0,"ov":[{"k":"dot","x":441.3,"y":327.3,"r":7,"col":"#78ffa0"},{"k":"text","x":443.3,"y":309.3,"text":"1","size":24},{"k":"dot","x":383.3,"y":241.2,"r":7,"col":"#78ffa0"},{"k":"text","x":385.3,"y":223.2,"text":"2","size":24},{"k":"dot","x":245.1,"y":288.7,"r":7,"col":"#78ffa0"},{"k":"text","x":247.1,"y":270.7,"text":"3","size":24},{"k":"dot","x":360.0,"y":480.0,"r":7,"col":"#78ffa0"},{"k":"text","x":362.0,"y":462.0,"text":"4","size":24}]},"title":"The 4-loop","cap":"The loop for this bulb, drawn in its own world (its Julia set). Green dots = the 4 notes, numbered by when the orbit visits them. Around the circle each step jumps 1 place: positions 2 3 4 1."},{"spec":{"t":"j","jr":0.12119278610590649,"ji":0.6106116922107542,"cx":0,"cy":0,"w":2.5,"maxit":2000,"rot":0.0,"ov":[{"k":"dot","x":394.9,"y":304.1,"r":7,"col":"#78ffa0"},{"k":"text","x":396.9,"y":286.1,"text":"1","size":24},{"k":"dot","x":291.8,"y":261.5,"r":7,"col":"#78ffa0"},{"k":"text","x":293.8,"y":243.5,"text":"2","size":24},{"k":"dot","x":245.3,"y":407.7,"r":7,"col":"#78ffa0"},{"k":"text","x":247.3,"y":389.7,"text":"3","size":24},{"k":"dot","x":422.4,"y":361.7,"r":7,"col":"#78ffa0"},{"k":"text","x":424.4,"y":343.7,"text":"4","size":24},{"k":"dot","x":359.9,"y":252.9,"r":7,"col":"#78ffa0"},{"k":"text","x":361.9,"y":234.9,"text":"5","size":24},{"k":"dot","x":215.8,"y":304.4,"r":7,"col":"#78ffa0"},{"k":"text","x":217.8,"y":286.4,"text":"6","size":24},{"k":"dot","x":360.0,"y":480.0,"r":7,"col":"#78ffa0"},{"k":"text","x":362.0,"y":462.0,"text":"7","size":24}]},"title":"The 7-loop","cap":"The loop for this bulb, drawn in its own world (its Julia set). Green dots = the 7 notes, numbered by when the orbit visits them. Around the circle each step jumps 2 places: positions 4 6 1 3 5 7 2."}]},{"title":"Period doubling","results":"<h2>Period doubling</h2>\n<table><tr><th>Period</th><th>Centre (real line)</th><th>Gap ratio</th></tr><tr><td class=k>1</td><td>0.0</td><td></td></tr><tr><td class=k>2</td><td>-1.0</td><td></td></tr><tr><td class=k>4</td><td>-1.310702641336833</td><td>3.218511</td></tr><tr><td class=k>8</td><td>-1.381547484432061</td><td>4.385678</td></tr><tr><td class=k>16</td><td>-1.396945359704561</td><td>4.600949</td></tr><tr><td class=k>32</td><td>-1.400253081214783</td><td>4.655130</td></tr><tr><td class=k>64</td><td>-1.400961962944841</td><td>4.666112</td></tr><tr><td class=k>128</td><td>-1.401113804939776</td><td>4.668549</td></tr><tr><td class=k>256</td><td>-1.401146325826946</td><td>4.669061</td></tr><tr><td class=k>512</td><td>-1.401153290849924</td><td>4.669172</td></tr><tr><td class=k>1024</td><td>-1.401154782546618</td><td>4.669195</td></tr></table>\n<p><b class=ok>Found:</b> the gap ratios converge to 4.669195 at period 1024. Feigenbaum's constant is 4.669202.</p>\n<p><b class=ok>Seen:</b> zooming 4.669× at a time on −1.40116 repeats the same picture five times; only the colours shift.</p>\n<p><b class=ok>Found:</b> past the chaos, at −1.75488, a full copy of the set with period 3. Order returns.</p>","frames":[{"spec":{"t":"m","cx":-1.36,"cy":0,"w":1.0,"maxit":2016,"rot":0.0,"ov":[{"k":"text","x":609.2,"y":400.0,"text":"2","size":28},{"k":"text","x":385.5,"y":400.0,"text":"4","size":28},{"k":"text","x":334.5,"y":400.0,"text":"8","size":28},{"k":"dot","x":330.4,"y":480.0,"r":6,"col":"#78ffa0"},{"k":"text","x":290.4,"y":520.0,"text":"chaos","size":24},{"k":"dot","x":75.7,"y":480.0,"r":6,"col":"#ffffff"},{"k":"text","x":55.7,"y":420.0,"text":"3","size":28}]},"title":"The spike","cap":"Going left along the real line: bulbs of period 2, 4, 8, … pile up at the green dot (−1.40116). Past it is chaos, and further out a copy with period 3 (white dot)."},{"spec":{"t":"m","cx":-1.4011551890920506,"cy":0,"w":0.12,"maxit":2040,"rot":0.0,"ov":[{"k":"dot","x":360.0,"y":480.0,"r":6,"col":"#78ffa0"}]},"title":"Zoom 1","cap":"Centred on the green dot, the end of the cascade. Each picture is 4.669× deeper than the last, and the picture repeats: the same bulbs, just one doubling further along."},{"spec":{"t":"m","cx":-1.4011551890920506,"cy":0,"w":0.025700325248046062,"maxit":2080,"rot":0.0,"ov":[{"k":"dot","x":360.0,"y":480.0,"r":6,"col":"#78ffa0"}]},"title":"×5 deeper","cap":"Centred on the green dot, the end of the cascade. Each picture is 4.669× deeper than the last, and the picture repeats: the same bulbs, just on   [1,10,100,1000,10000].forEach(v=>{ if(v<=s.z[s.z.length-1]){ ctx.fillText(v>=1000?(v/1000)+'k':String(v),lx(v)-8,A.B+8); } });
  [-0.2,0,0.2,0.4].forEach(v=>{ ctx.fillText(String(v),A.L-46,ly(v)-8); ctx.strokeStyle='#1c2130'; ctx.beginPath(); ctx.moveTo(A.L,ly(v)); ctx.lineTo(A.R,ly(v)); ctx.stroke(); });
  [['s2','2-fold','#ffb35c'],['s4','4-fold','#7aa2ff'],['s8','8-fold','#9be7a8']].forEach(([k,t,c])=>{ ctx.strokeStyle=c; ctx.lineWidth=3.5; ctx.beginPath();
    s[k].forEach((v,i)=>{ const X=lx(s.z[i]), Y=ly(v); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); ctx.stroke(); });
  ctx.font='18px system-ui'; ctx.textBaseline='middle'; [['2-fold','#ffb35c'],['4-fold','#7aa2ff'],['8-fold','#9be7a8']].forEach(([t,c],i)=>{ const X=A.L+20+i*190; ctx.fillStyle=c; ctx.fillRect(X,A.T-26,26,6); ctx.fillStyle='#e8ebf2'; ctx.fillText(t,X+36,A.T-23); });
  ctx.fillStyle='#8b93a7'; ctx.font='17px system-ui'; ctx.fillText('the copy fills the frame →',A.R-240,ly(-0.12)); }
function chart6(s){ const A=axes(0,0,0,0,'All 983 bulbs and copies up to period 10','period','size');
  const lo=Math.log10(5e-11), hi=Math.log10(0.8);
  const lx=v=>A.L+(v-1.5)/9*(A.R-A.L), ly=v=>A.B-(Math.log10(v)-lo)/(hi-lo)*(A.B-A.T);
  ctx.font='16px ui-monospace,monospace'; ctx.fillStyle='#8b93a7'; ctx.textBaseline='top';
  for(let p=2;p<=10;p++) ctx.fillText(String(p),lx(p)-6,A.B+8);
  for(let e=-10;e<=0;e+=2){ ctx.fillText('10^'+e,A.L-80,ly(10**e)-8); ctx.strokeStyle='#1c2130'; ctx.beginPath(); ctx.moveTo(A.L,ly(10**e)); ctx.lineTo(A.R,ly(10**e)); ctx.stroke(); }
  let seed=1; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  s.pts.split(' ').map(t=>{ const [n,e,c]=t.split(','); return [+n,10**(+e/1000),+c]; }).forEach(([n,sz,cp])=>{ const X=lx(n+(rnd()-0.5)*0.56), Y=ly(sz); ctx.fillStyle=cp?'rgba(255,179,92,.75)':'rgba(122,162,255,.95)';
    ctx.beginPath(); ctx.arc(X,Y,cp?3:4.5,0,7); ctx.fill(); });
  legend([['copies (free-standing)','#ffb35c'],['bulbs (attached)','#7aa2ff']],A.L+16,A.B-96); }

/* ---------- navigation ---------- */
let r=0, f=0, showingRes=false;
const tabs=document.getElementById('tabs'), st=document.getElementById('st'), cap=document.getElementById('cap'), dots=document.getElementById('dots');
ROUTES.forEach((R,i)=>{ const b=document.createElement('button'); b.textContent=(i+1)+' · '+R.title; b.onclick=()=>{ r=i; show(0); }; tabs.appendChild(b); });
function show(k){ const R=ROUTES[r], n=R.frames.length+1; f=Math.max(0,Math.min(n-1,k));
  [...tabs.children].forEach((b,i)=>b.classList.toggle('on',i===r));
  tabs.children[r].scrollIntoView({inline:'nearest',block:'nearest'});
  dots.replaceChildren(); for(let i=0;i<n;i++){ const d=document.createElement('i'); if(i===f) d.className='on'; dots.appendChild(d); }
  document.getElementById('n').textContent=(f+1)+' / '+n;
  const old=st.querySelector('.res'); if(old) old.remove();
  showingRes = f===n-1;
  if(showingRes){ const d=document.createElement('div'); d.className='res'; d.innerHTML=R.results; st.appendChild(d);
    cap.innerHTML='<b>Results</b><p>What route '+(r+1)+' found. Swipe back to see any picture again.</p>'; jobId++; queue=[]; status(); return; }
  const F=R.frames[f]; cap.innerHTML='<b></b><p></p>'; cap.querySelector('b').textContent=F.title; cap.querySelector('p').textContent=F.cap;
  startFrame(r,f); }
document.getElementById('tl').onclick=()=>show(f-1);
document.getElementById('tr').onclick=()=>show(f+1);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') show(f+1); if(e.key==='ArrowLeft') show(f-1); });
let x0=null,y0=null;
st.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
st.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)) show(f+(dx<0?1:-1)); x0=null; },{passive:true});
show(0);
