<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D Wind Farm Lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #081b2a; color: #e6f3f8; font: 14px system-ui, -apple-system, Segoe UI, sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
  header { padding: 8px 12px 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  header b { margin-right: 4px; }
  button, select { background: #183b4e; color: #fff; border: 1px solid #527789; border-radius: 8px; padding: 7px 10px; font: inherit; }
  button:active { background: #24536b; }
  #status { padding: 0 12px 6px; opacity: .8; font-size: 12.5px; line-height: 1.35; min-height: 1.35em; }
  #main { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: 1fr; grid-template-rows: 52% 48%; }
  @media (min-width: 900px) { #main { grid-template-columns: 1fr 410px; grid-template-rows: 1fr; } }
  #stage { position: relative; min-height: 0; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #stage canvas.plan { background: #0b2233; z-index: 1; }
  #stage canvas[hidden] { display: none; }
  #viewSwitch { position: absolute; top: 8px; left: 8px; z-index: 3; display: flex; border: 1px solid #527789; border-radius: 9px; overflow: hidden; }
  #viewSwitch button { border: 0; border-radius: 0; padding: 7px 12px; background: rgba(24,59,78,.92); }
  #viewSwitch button.on { background: #ffd65a; color: #1b2a33; font-weight: 600; }
  #legend { position: absolute; right: 8px; top: 8px; z-index: 3; font-size: 10.5px; text-align: left; background: rgba(8,27,42,.82); padding: 5px 7px; border-radius: 8px; border: 1px solid #2e5366; cursor: pointer; max-width: 190px; }
  #legend .bar { width: 100%; min-width: 120px; height: 7px; border-radius: 4px; margin: 4px 0 2px; }
  #legend .hint { opacity: .6; }
  #legend .ends { display: flex; justify-content: space-between; opacity: .8; }
  #error { position: absolute; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; padding: 20px; }
  #error div { max-width: 560px; background: #2a1620; border: 1px solid #a65370; border-radius: 10px; padding: 14px 16px; white-space: pre-wrap; font-size: 13px; }
  #panel { overflow-y: auto; border-top: 1px solid #22485c; background: #0a2131; -webkit-overflow-scrolling: touch; }
  @media (min-width: 900px) { #panel { border-top: 0; border-left: 1px solid #22485c; } }
  #panel .tabs { position: sticky; top: 0; z-index: 2; display: flex; gap: 4px; padding: 8px; background: #0a2131; border-bottom: 1px solid #1c3c4e; }
  #panel .tabs button { flex: 1; padding: 6px 4px; }
  #panel .tabs button.on { background: #2b5d77; border-color: #8fc3dc; }
  .tabbody { padding: 4px 10px 24px; }
  .tabbody h3 { font-size: 13px; margin: 14px 2px 6px; color: #ffd65a; font-weight: 600; }
  .pick { margin: 8px 2px; font-size: 13px; }
  .pick select { padding: 4px 6px; }
  .muted { opacity: .65; font-size: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .grid.one { grid-template-columns: 1fr; }
  .card { background: #11304a; border: 1px solid #234c64; border-radius: 9px; padding: 7px 9px; cursor: pointer; min-width: 0; }
  .card.open { grid-column: 1 / -1; background: #143956; border-color: #4b84a3; }
  .card .ct { font-size: 11.5px; opacity: .85; display: flex; justify-content: space-between; gap: 4px; align-items: flex-start; }
  .card .val { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .card .val small { font-size: 12px; font-weight: 400; opacity: .75; }
  .card .sub { font-size: 11.5px; opacity: .8; margin-top: 2px; line-height: 1.35; }
  .card .more { font-size: 12.5px; line-height: 1.45; margin-top: 6px; }
  .card .more:empty { display: none; }
  .card .hint { font-size: 10.5px; opacity: .5; margin-top: 3px; text-align: right; }
  .eq { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; background: #0b2233; border-radius: 6px; padding: 6px 8px; margin-top: 6px; line-height: 1.5; }
  .warn { color: #ffb38a; }
  .intro { font-size: 13.5px; line-height: 1.5; margin: 12px 4px; }
  button.small { padding: 3px 8px; font-size: 12px; margin-left: 6px; }
  #toast { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 4; background: rgba(42,22,32,.95); border: 1px solid #a65370; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; pointer-events: none; opacity: 0; transition: opacity .25s; max-width: 90%; }
  #toast.on { opacity: 1; }
  @media (max-width: 520px) { header b { display: none; } }
  .chip { font-size: 9.5px; padding: 1px 6px; border-radius: 9px; white-space: nowrap; font-weight: 600; }
  .chip.exact, .chip.theory { background: #1f5d3d; color: #c9f2d6; }
  .chip.literature { background: #1f4d7a; color: #cfe6ff; }
  .chip.approx { background: #6b5214; color: #ffe8a8; }
  .chip.reference { background: #503a78; color: #e5d6ff; }
  .chip.numerical { background: #3b4a55; color: #dbe6ee; }
  .bar { height: 6px; background: #0b2233; border-radius: 3px; margin: 4px 0 2px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: #7fd3ff; }
  table.mini, table.list { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  table.mini th, table.mini td, table.list th, table.list td { padding: 3px 4px; text-align: left; border-bottom: 1px solid #1d4257; }
  table.list tr[data-select] { cursor: pointer; }
  table.list tr.sel { background: #3a3414; }
  canvas.chart { width: 100%; display: block; margin: 4px 0 6px; }
  code { font-size: 11.5px; }
</style>
</head>
<body>
<header>
  <b>3D Wind Farm Lab</b>
  <select id="scenario" aria-label="Scenario">
    <option value="coast">Coastal</option>
    <option value="plain">Plains</option>
    <option value="mountain">Mountains</option>
    <option value="gust">Variable winds</option>
  </select>
  <select id="layoutMode" aria-label="Turbines">
    <option value="random">12 random turbines</option>
    <option value="build">Empty map — place your own</option>
  </select>
  <button id="random">New map</button>
  <button id="pause">Pause</button>
  <button id="reset">Reset view</button>
</header>
<div id="status">Loading…</div>
<div id="main">
  <div id="stage">
    <div id="viewSwitch"><button data-view="3d" class="on">3D</button><button data-view="top">Top</button><button data-view="side">Side</button></div>
    <button id="legend" hidden><span id="legendLabel"></span> <span class="hint">(tap to switch)</span><div class="bar" id="legendBar"></div><div class="ends"><span></span><span></span></div></button>
    <div id="toast"></div>
    <div id="error"><div id="errorText"></div></div>
  </div>
  <div id="panel"></div>
</div>
<script>
  // Classic script: runs even when module loading fails, so failures are visible.
  (function () {
    function show(msg) {
      var box = document.getElementById('error'), t = document.getElementById('errorText');
      t.textContent = (t.textContent ? t.textContent + '\n\n' : '') + msg;
      box.style.display = 'flex';
      document.getElementById('status').textContent = 'Not running — see the message below.';
    }
    window.windLabError = show;
    window.addEventListener('error', function (e) {
      if (/ResizeObserver loop/.test(e.message || '')) return; // benign browser notice
      show('Error: ' + (e.message || (e.target && e.target.src ? 'could not load ' + e.target.src : 'unknown')));
    }, true);
    window.addEventListener('unhandledrejection', function (e) { show('Error: ' + (e.reason && e.reason.message || e.reason)); });
    setTimeout(function () {
      if (!window.windLabReady && document.getElementById('error').style.display !== 'flex')
        show('Still loading after 20 s. three.js comes from a CDN (jsDelivr, then unpkg); check the network connection.');
    }, 20000);
  })();
</script>
<script nomodule>window.windLabError('This browser does not support JavaScript modules; please use a current browser.');</script>
<script type="module" src="./main.js"></script>
</body>
</html>
