name: Birth controls regression
on:
  push:
    branches: [rotation-coherence-control-design, rotation-coherence, expedition-coherence, expedition-checkpoint, accumulation-first, coherence-render-stability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          find explore/birth-of-structure-lab -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess
          html=pathlib.Path('explore/birth-of-structure-lab/index.html').read_text()
          for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S):
              if script.strip():
                  subprocess.run(['node','--check','-'],input=script,text=True,check=True)
          PY
      - name: Cycle evolution regression
        run: node --test explore/birth-of-structure-lab/cycle-evolution.test.cjs
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Mobile toolbar smoke test
        run: |
          python3 -m http.server 8765 > /tmp/birth-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node --test explore/birth-of-structure-lab/controls.browser.test.cjs
