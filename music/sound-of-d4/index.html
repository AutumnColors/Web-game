<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>

  box-sizing:border-box;

  --c1A:#26303D; --c1Aink:#F3F6F9; --c2A:#DCE2E9; --c4A:#F0DFB6; --c2B:#CBE3E7; --c2C:#F1D1D7; --cellink:#16202C;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#151C25; --ink:#E5EAF0; --muted:#8D99A9; --line:#28313C; --accent:#839AFF;
  --i1:#B3BDCB; --i3:#7690FF; --i3p:#FF8A62; --i4:#5FCB90; --i5:#CC8AE8;
  --c1A:#E5EAF0; --c1Aink:#0E131A; --c2A:#232C37; --c4A:#3B3120; --c2B:#1C373D; --c2C:#40252B; --cellink:#E5EAF0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151C25; --ink:#E5EAF0; --muted:#8D99A9; --line:#28313C; --accent:#839AFF;
  --i1:#B3BDCB; --i3:#7690FF; --i3p:#FF8A62; --i4:#5FCB90; --i5:#CC8AE8;
  --c1A:#E5EAF0; --c1Aink:#0E131A; --c2A:#232C37; --c4A:#3B3120; --c2B:#1C373D; --c2C:#40252B; --cellink:#E5EAF0; color-scheme:dark }
html{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px) }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--display); font-size:15px; line-height:1.5 }
[hidden]{ display:none!important }
.wrap{ max-width:1100px; margin:0 auto; padding-block:28px 48px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); display:grid; gap:22px }
header{ display:grid; gap:6px }
h1{ font-weight:800; font-size:clamp(2.1rem,7vw,3.6rem); line-height:1; letter-spacing:-0.02em; margin:0; text-wrap:balance }
h1 sub{ font-size:0.55em; vertical-align:baseline; position:relative; top:0.2em }
.sub{ font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:0.02em }
.back{ font-family:var(--mono); font-size:12px; color:var(--muted); text-decoration:none; justify-self:start }
.back:hover{ color:var(--accent) }
h2{ font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); font-weight:600; margin:0 }

.controls{ display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; padding:12px; background:var(--surface); border:1px solid var(--line); border-radius:10px }
button, select{ font:inherit; color:var(--ink) }

label.ctl{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted) }
select{ background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px }
input[type=range]{ accent-color:var(--accent); width:110px }
.val{ font-family:var(--mono); font-size:12px; color:var(--ink); min-width:4.5em; font-variant-numeric:tabular-nums }

.seg i.a{ opacity:1 }
.seg.on{ outline:2px solid var(--accent); outline-offset:1px }
.seg:focus-visible{ outline:2px solid var(--accent) }
.band{ display:grid; gap:8px }
.rows{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px }
.row{ display:grid; gap:6px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); min-width:0 }

.row .lock{ font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em }

.row input[type=range]{ width:100% }
.row select{ width:100% }
.stage{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding-block:12px; display:grid; justify-items:center; gap:6px }
.stage canvas{ max-width:720px }
.stage .song{ width:100%; max-width:720px; padding-inline:14px; box-sizing:border-box }
.ph{ position:absolute; top:-5px; bottom:-5px; left:0; width:2px; margin-left:-1px; background:var(--ink); border-radius:1px; pointer-events:none; will-change:transform }
canvas{ width:100%; max-width:470px; aspect-ratio:1; display:block }
.now{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; justify-content:center; font-family:var(--mono); font-size:13px }
.perm{ font-size:1.25rem; font-weight:500 }
.tag{ font-family:var(--mono); font-size:12px; padding:2px 8px; border-radius:4px; background:var(--c2A); color:var(--cellink) }

.tblwrap{ overflow-x:auto }
table{ border-collapse:collapse; font-family:var(--mono); font-size:13px; width:100%; font-variant-numeric:tabular-nums }
th, td{ padding:6px 8px; text-align:center; border-bottom:1px solid var(--line) }
thead th{ font-weight:500; color:var(--muted); font-size:12px }
thead th small{ display:block; font-size:10px }
tbody th{ text-align:left; font-weight:500 }
td.hot, th.hot{ background:color-mix(in srgb, var(--accent) 16%, transparent) }
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(64px,1fr)); gap:5px }
.cell{ border:0; border-radius:5px; padding:8px 2px 6px; cursor:pointer; font-family:var(--mono); font-size:11px; color:var(--cellink); display:grid; gap:1px; justify-items:center; line-height:1.2 }
.cell small{ font-size:9px; opacity:0.7 }
.cell.k1A{ background:var(--c1A); color:var(--c1Aink) } .cell.k2A{ background:var(--c2A) } .cell.k4A{ background:var(--c4A) } .cell.k2B{ background:var(--c2B) } .cell.k2C{ background:var(--c2C) }
.cell.on{ outline:2.5px solid var(--accent); outline-offset:1px }
.chords{ display:grid; gap:4px; font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums }
.chords div{ display:grid; grid-template-columns:3.2em 1fr; gap:8px; align-items:baseline }
.chords b{ font-weight:500 }
.chords span{ color:var(--muted) }
@media (prefers-reduced-motion: reduce){ *{ transition:none!important } }
</style></head><body>

<div class="wrap">
  <header>
    <a class="back" href="../../">← Levels</a>
    <h1>Sound of D<sub>4</sub></h1>
    <div class="sub">8 symmetries of the square · 5 irreps · every note lands on one diminished-seventh chord</div>
  </header>

  <div class="controls">
    <button class="play" id="play">Play</button>
    <label class="ctl" for="mode">Walk
      <select id="mode">
        <option value="class" selected>By class (e → r² → r → diagonal → edge)</option>
        <option value="song">Song: Roman's arrangement</option>
        <option value="bfs">Word length from e (generators r, s)</option>
        <option value="lex">Lexicographic</option>
        <option value="reps">Five class chords</option>
      </select>
    </label>
    <label class="ctl" for="bpm">Tempo <input type="range" id="bpm" min="60" max="480" step="2" value="126"><span class="val" id="bpmv"></span></label>
    <label class="ctl" for="base">Root
      <select id="base"><option value="65.406">C (C4 = 261.6 Hz)</option><option value="73.416">D (D4 = 293.7 Hz)</option><option value="82.407">E (E4 = 329.6 Hz)</option><option value="87.307">F (F4 = 349.2 Hz)</option><option value="97.999">G (G4 = 392 Hz)</option><option value="110" selected>A (A4 = 440 Hz)</option><option value="123.471">B (B4 = 493.9 Hz)</option></select>
    </label>
    <label class="ctl" for="motion">Motion
      <select id="motion"><option value="lines" selected>Melody lines</option><option value="chords">Static chords</option></select>
    </label>
    <label class="ctl" for="voice">Sound
      <select id="voice"><option value="band" selected>Band</option><option value="pure">Pure tones</option></select>
    </label>
    <label class="ctl" for="smooth">Upper voices
      <select id="smooth"><option value="smooth" selected>Smooth</option><option value="raw">Raw</option></select>
    </label>
    <label class="ctl" for="loop"><input type="checkbox" id="loop"> Loop</label>
    <div class="chips" id="chips" aria-label="Representations"></div>
  </div>

  <div class="band">
    <div class="songhead"><h2>Band</h2><div class="chips"><select id="layout" aria-label="Band layout"><option value="V" selected>Roman: drums 1′, piano 1″, violin 1‴</option><option value="C">Guitar on 1‴</option><option value="D">Drums on the 2</option><option value="custom">Custom</option></select>
      <button class="chip" id="swapbd" style="--c:var(--accent)">Swap bass ↔ drums</button>
      <button class="chip" id="swap" style="--c:var(--accent)">Swap 1′ ↔ 1″</button></div></div>
    <div class="rows" id="rows"></div>
  </div>

  <section class="stage" aria-label="D₄ octave clock">
    <div class="song" id="song">
      <div class="songhead"><h2>Arrangement</h2><span class="sub" id="songpos"></span></div>
      <div class="strip" id="strip"></div>
    </div>
    <canvas id="cv" aria-label="Eigenvalues of the current symmetry on the unit circle, one ring per representation"></canvas>
    <div class="now"><span class="perm" id="perm"></span><span class="tag" id="tag"></span><span class="sub" id="pos"></span></div>
  </section>

  <div hidden><div id="chords"></div><table id="ct"></table><div id="grid"></div><table id="tp"></table></div>
</div>

<script>
// ---------- group core: D4 as permutations of the square's corners 0,1,2,3 (counter-clockwise) ----------
const N=4;
const comp=(p,q)=>q.map(i=>p[i]);           // (p∘q)(i)=p(q(i))
const inv=p=>{ const r=[]; p.forEach((v,i)=>r[v]=i); return r; };
const key=p=>p.join('');
const ID=[0,1,2,3];
const order=p=>{ let q=p.slice(),k=1; while(key(q)!==key(ID)){ q=comp(p,q); k++; } return k; };
const R=[1,2,3,0];          // quarter turn
const S=[0,3,2,1];          // flip across the diagonal through corners 0 and 2
function bfs(){ const gens=[R,S,inv(R)], seen=new Set([key(ID)]), out=[ID]; for(let i=0;i<out.length;i++){ for(const s of gens){ const n=comp(out[i],s); if(!seen.has(key(n))){ seen.add(key(n)); out.push(n); } } } return out; }
const G=bfs();
const NG=G.length;           // 8
// names r^k and s·r^k
const POW=[ID]; for(let k=1;k<4;k++) POW.push(comp(R,POW[k-1]));
const SUP=['','','²','³'];
function cyc(p){ for(let k=0;k<4;k++){ if(key(p)===key(POW[k])) return k?'r'+SUP[k]:'e'; if(key(p)===key(comp(S,POW[k]))) return k?'s·r'+SUP[k]:'s'; } return '?'; }
const fixed=p=>p.filter((v,i)=>v===i).length;
const HALF=key(POW[2]);
const cls={};
G.forEach(p=>{ const o=order(p); cls[key(p)] = o===1?'1A' : o===4?'4A' : key(p)===HALF?'2A' : fixed(p)===2?'2B':'2C'; });

const CLASSES=['1A','2A','4A','2B','2C'];
const SIZE={'1A':1,'2A':1,'4A':2,'2B':2,'2C':2};
const CLN={'1A':'identity','2A':'half turn','4A':'quarter turn','2B':'diagonal flip','2C':'edge flip'};
const IRR=[
 {id:'1', dim:1,reg:1,pan:0,   vol:0.75,col:'--i1', what:'Always +1: the square does nothing to it.'},
 {id:'1′',dim:1,reg:2,pan:-0.6,vol:1,   col:'--i3', what:'−1 on quarter turns and edge flips.'},
 {id:'1″',dim:1,reg:2,pan:0.6, vol:1,   col:'--i3p',what:'−1 on quarter turns and diagonal flips.'},
 {id:'1‴',dim:1,reg:4,pan:-0.2,vol:0.75,col:'--i4', what:'−1 on every flip: did the square turn over?'},
 {id:'2', dim:2,reg:8,pan:0.2, vol:0.5, col:'--i5', what:'The square itself, as 2×2 matrices.'}];
const BAND={
 bass:  {name:'bass',         reg:0.5,pan:0,    lp:900,  out:0.65},
 piano: {name:'piano',        reg:2,  pan:-0.5, lp:6000, out:0.50},
 guitar:{name:'rhythm guitar',reg:1,  pan:0.5,  lp:3200, out:0.14,drive:9,k:3},
 drums: {name:'drums',        reg:1,  pan:0,    lp:12000,out:0.75},
 lead:  {name:'lead guitar',  reg:4,  pan:0.15, lp:4800, out:0.16,drive:14,k:3,delay:true},
 violin:{name:'violin',       reg:4,  pan:-0.15,lp:4200, out:0.42,delay:true},
 voice: {name:'voice',        reg:4,  pan:0,    lp:5000, out:0.55,delay:true},
 gamelan:{name:'gamelan',     reg:4,  pan:0.1,  lp:7000, out:0.16,delay:true}
};
const PRESETS={V:['bass','drums','piano','violin','gamelan'],C:['bass','drums','piano','guitar','gamelan'],D:['bass','piano','guitar','violin','drums']};
const assign=PRESETS.V.slice();
const level=[1,1,1,0.6,1];   // violin sits back in the mix
// eigenvalues as fractions of a turn, per class, per irrep. Only 0, ¼, ½, ¾ ever appear.
const SPEC={
 '1A':[[0],[0],[0],[0],[0,0]],
 '2A':[[0],[0],[0],[0],[.5,.5]],
 '4A':[[0],[.5],[.5],[0],[.25,.75]],
 '2B':[[0],[0],[.5],[.5],[0,.5]],
 '2C':[[0],[.5],[0],[.5],[0,.5]]};
const CHAR={'1A':['1','1','1','1','2'],'2A':['1','1','1','1','−2'],'4A':['1','−1','−1','1','0'],'2B':['1','1','−1','−1','0'],'2C':['1','−1','1','−1','0']};
const merged=fr=>{ const m=new Map(); fr.forEach(f=>{ const k=Math.round(f*1e6)/1e6; m.set(k,(m.get(k)||0)+1); }); return [...m.entries()].sort((a,b)=>a[0]-b[0]); };

function sequence(mode){
  const lex=G.slice().sort((a,b)=>key(a)<key(b)?-1:1);
  if(mode==='lex') return lex;
  if(mode==='bfs' || mode==='song') return bfs();
  if(mode==='reps') return CLASSES.map(c=>lex.find(p=>cls[key(p)]===c));
  return CLASSES.flatMap(c=>bfs().filter(p=>cls[key(p)]===c));
}
// Roman's arrangement, carried over from A5 layer for layer: 0=1, 1=1′, 2=1″, 3=1‴, 4=2.
// D4 has 8 symmetries instead of 60, so the long walks go round the group several times.
// Middle tower: the whole band plays the group by class (1+1+2+2+2), three laps.
// Peak: all five, walking OUT from e by word length, five laps. Outro: walking back IN, landing on e on the last beat.
// The last pyramid changes the band: gamelan moves to 1‴, a sung voice takes the 2, no violin.
const LAST={3:'gamelan',4:'voice'};
const SONG=[
 {m:[0],n:16},{m:[0,1],n:8},{m:[0],n:8},{m:[0,1],n:8},{m:[0,1,2],n:16},
 {m:[0,1],n:8},{m:[0],n:8},
 {m:[0,1],n:4},{m:[0,1,2],n:4},{m:[0,1,2,3,4],n:24,walk:'class'},
 {m:[0,1,2],n:8},{m:[0,1],n:8},{m:[0,1],n:8},
 {m:[0,1],n:4,inst:LAST},{m:[0,1,2],n:4,inst:LAST},{m:[0,1,2,3],n:8,inst:LAST},
 {m:[0,1,2,3,4],n:40,walk:'out',inst:LAST},
 {m:[0,1,2,3],n:8,walk:'home',inst:LAST},{m:[0,1,2],n:4,walk:'home',inst:LAST},{m:[0,1],n:16,walk:'home',ritard:8,inst:LAST}];
const SWELL=[3,4], SWELL_PEAK=1.35;
const DUCK_BASE=0.85, DUCK_DEPTH=0.35;
function swell(x){ const x0=0.82; if(x>=x0) return Math.exp(-0.5*Math.pow((x-x0)/0.06,2)); const u=x/x0; return (0.4+0.95*(0.2*u+0.8*Math.pow(u,4)))/SWELL_PEAK; }
function songSteps(){
  const walk=bfs(), byClass=sequence('class'), out=[]; let n=0, h=0;
  const H=SONG.filter(s=>s.walk==='home').reduce((a,s)=>a+s.n,0);
  SONG.forEach((s,si)=>{ for(let k=0;k<s.n;k++){
    let gi = s.walk==='out' ? k%NG : s.walk==='home' ? (H-1-(h++))%NG : n%NG;
    const p = s.walk==='class' ? byClass[k%NG] : walk[gi];
    if(s.walk==='class') gi=walk.findIndex(q=>key(q)===key(p));
    const st={p,gi,mask:s.m,sec:si,mul:s.speed||1,over:s.inst||null};
    if(s.ritard && k>=s.n-s.ritard){ const j=k-(s.n-s.ritard)+1; st.mul=1+j*0.12; }
    out.push(st); n++; } });
  const last=out[out.length-1]; last.hold=true; last.mul=6;
  SWELL.forEach(L=>{ let k=0; while(k<out.length){ if(!out[k].mask.includes(L)){ k++; continue; }
    let e=k; while(e<out.length && out[e].mask.includes(L)) e++;
    for(let j=k;j<e;j++){ (out[j].inten=out[j].inten||{})[L]=swell((j-k+0.5)/(e-k)); }
    k=e; } });
  out.forEach(st=>{ const up=Math.max(st.inten&&st.inten[3]||0, st.inten&&st.inten[4]||0); st.duck=DUCK_BASE*(1-DUCK_DEPTH*up); });
  return out;
}
</script>
<script>
// ---------- UI ----------
const $=id=>document.getElementById(id);
const muted=new Set();
let seq=sequence(document.getElementById('mode').value), cur=ID, curIdx=-1, pulseAt=-1, activeMask=null, curSec=-1, curLines=null, curPrev=null, curDur=0.5, curInten=null, curStep=undefined, curDuck=undefined;
const isOff=i=>muted.has(i) || (activeMask && !activeMask.includes(i));

const chips=$('chips');
IRR.forEach((r,i)=>{ const b=document.createElement('button'); b.className='chip'; b.id='chip'+i; b.textContent=r.id+' '+BAND[assign[i]].name; b.style.setProperty('--c','var('+r.col+')'); b.setAttribute('aria-pressed','true'); b.title='Mute or unmute the '+r.id+' representation';
  b.onclick=()=>{ if(muted.has(i)){ muted.delete(i); b.setAttribute('aria-pressed','true'); } else { muted.add(i); b.setAttribute('aria-pressed','false'); } showInfo(); };
  chips.appendChild(b); });

const PICK=['bass','drums','piano','guitar','lead','violin','voice','gamelan'];
const ROLE=['root','twin of 1″','twin of 1′','',''];
function buildRows(){
  $('rows').innerHTML=IRR.map((r,i)=>{
    const ctl = '<select id="inst'+i+'" aria-label="Instrument for the '+r.id+'">'+PICK.map(n=>'<option value="'+n+'"'+(assign[i]===n?' selected':'')+'>'+BAND[n].name+'</option>').join('')+'</select>';
    return '<div class="row"><div class="top"><b style="color:var('+r.col+')">'+r.id+'</b><span class="lock">'+ROLE[i]+'</span></div><div class="what">'+r.what+'</div>'+ctl+
      '<label class="ctl" for="lvl'+i+'">Level <input type="range" id="lvl'+i+'" min="0" max="150" value="'+Math.round(level[i]*100)+'"></label></div>'; }).join('');
  IRR.forEach((r,i)=>{ $('lvl'+i).oninput=e=>{ level[i]=e.target.value/100; }; $('inst'+i).onchange=e=>{ assign[i]=e.target.value; $('layout').value='custom'; relabel(); }; });
}
function relabel(){
  IRR.forEach((r,i)=>{ $('chip'+i).textContent=r.id+' '+BAND[assign[i]].name; const el=$('inst'+i); if(el) el.value=assign[i]; });
  showInfo();
}
$('swapbd').onclick=()=>{ const b=assign.indexOf('bass'), d=assign.indexOf('drums'); if(b<0||d<0) return; assign[b]='drums'; assign[d]='bass'; $('layout').value='custom'; relabel(); };
$('swap').onclick=()=>{ [assign[1],assign[2]]=[assign[2],assign[1]]; $('layout').value='custom'; relabel(); };
$('layout').onchange=e=>{ const p=PRESETS[e.target.value]; if(p){ p.forEach((n,i)=>assign[i]=n); relabel(); } };
function buildTP(){
  const num={'1':1,'2':2,'0':0,'−1':-1,'−2':-2};
  const X=IRR.map((r,i)=>CLASSES.map(c=>num[CHAR[c][i]]));
  const dec=(a,b)=>IRR.map((r,j)=>[r,Math.round(CLASSES.reduce((s,c,ci)=>s+SIZE[c]*X[a][ci]*X[b][ci]*X[j][ci],0)/NG)]).filter(x=>x[1])

function markSec(){ document.querySelectorAll('.seg.on').forEach(e=>e.classList.remove('on')); if(curSec>=0){ const e=$('seg'+curSec); if(e) e.classList.add('on');
  const s=SONG[curSec]; $('songpos').textContent='section '+(curSec+1)+' / '+SONG.length+' · '+s.m.map(i=>IRR[i].id).join(' + '); } else $('songpos').textContent=SONG.length+' sections · '+SONGSTEPS.length+' steps'; }
const lab=()=>{ $('bpmv').textContent=$('bpm').value+' bpm'; };
$('voice').onchange=showInfo; $('base').onchange=showInfo; $('motion').onchange=()=>{ curLines=null; showInfo(); };
$('bpm').oninput=lab; lab();

// ---------- octave clock ----------
const cv=$('cv'), cx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){ const d=devicePixelRatio||1, w=cv.clientWidth; cv.width=w*d; cv.height=w*d; }
addEventListener('resize',size); size();
function draw(){
  if(ac && queue.length){ const now=ac.currentTime; let hit=null; for(const q of queue) if(q.t<=now) hit=q;
    if(hit && hit.t!==pulseAt){ cur=hit.p; curIdx=hit.i; pulseAt=hit.t; activeMask=hit.mask||null; curLines=hit.lines||null; curPrev=hit.lines?hit.lines.prev:null; curDur=hit.dur; curInten=hit.inten||null; curStep=hit.step; curDuck=hit.duck;
      if(hit.sec!==undefined && hit.sec!==curSec){ curSec=hit.sec; markSec(); } showInfo(); }
    queue=queue.filter(q=>q.t+q.dur>now || q===hit);
    if(playing && !timer && now>lastEnd){ stop(); } }
  const ph=$('ph');
  if(ph){ if(playing && isSong() && curStep!==undefined && curSec>=0 && ac){ const seg=$('seg'+curSec), sn=ac.currentTime-pulseAt;
      const fr=Math.min(1,(curStep-secStart[curSec]+Math.min(1,Math.max(0,sn/curDur)))/SONG[curSec].n);
      ph.hidden=false; ph.style.transform='translateX('+(seg.offsetLeft+seg.offsetWidth*fr)+'px)'; } else ph.hidden=true; }
  const cs=getComputedStyle(document.documentElement), W=cv.width, C=W/2, R=W*0.44, d=devicePixelRatio||1;
  cx.clearRect(0,0,W,W);
  const amp=(ac && pulseAt>=0 && !reduce)?Math.max(0,1-(ac.currentTime-pulseAt)*2.2):0;
  // 12-TET ticks; the four long ones (0, 300, 600, 900 ¢) are the only places D4 ever lands
  cx.strokeStyle=cs.getPropertyValue('--line'); cx.lineWidth=1.5*d;
  for(let s=0;s<12;s++){ const a=-Math.PI/2+s*Math.PI/6; cx.beginPath(); cx.moveTo(C+Math.cos(a)*R*1.02,C+Math.sin(a)*R*1.02); cx.lineTo(C+Math.cos(a)*R*(s%3===0?1.09:1.06),C+Math.sin(a)*R*(s%3===0?1.09:1.06)); cx.stroke(); }
  cx.fillStyle=cs.getPropertyValue('--muted'); cx.font=(11*d)+'px '+cs.getPropertyValue('--mono'); cx.textAlign='center';
  cx.fillText('0¢',C,C-R*1.13+4*d); cx.fillText('600¢',C,C+R*1.13+4*d);
  cx.textAlign='left'; cx.fillText('300¢',C+R*1.11,C+4*d); cx.textAlign='right'; cx.fillText('900¢',C-R*1.11,C+4*d); cx.textAlign='center';
  const c=cls[key(cur)];
  IRR.forEach((r,i)=>{
    const rr=R*(0.2+0.2*i), col=cs.getPropertyValue(r.col).trim(), off=isOff(i);
    const sw=(!off && curInten && curInten[i]!==undefined)?0.22+0.78*curInten[i]:(!off && curDuck!==undefined && assign[i]==='piano' && $('voice').value==='band')?0.55+0.45*curDuck/DUCK_BASE:1;
    cx.globalAlpha=off?0.18:sw;
    cx.strokeStyle=col; cx.lineWidth=1*d; cx.globalAlpha*=0.35; cx.beginPath(); cx.arc(C,C,rr,0,Math.PI*2); cx.stroke(); cx.globalAlpha=off?0.18:sw;
    const m=merged(SPEC[c][i]);
    if(m.length>1){ cx.strokeStyle=col; cx.lineWidth=(1.5+amp*1.5)*d; cx.globalAlpha*=0.55; cx.beginPath();
      m.forEach(([f],j)=>{ const a=-Math.PI/2+f*Math.PI*2, x=C+Math.cos(a)*rr, y=C+Math.sin(a)*rr; j?cx.lineTo(x,y):cx.moveTo(x,y); }); cx.closePath(); cx.stroke(); cx.globalAlpha=off?0.18:sw; }
    const since=ac&&pulseAt>=0?ac.currentTime-pulseAt:9, isDrum=$('voice').value==='band' && assign[i]==='drums';
    m.forEach(([f,k])=>{ const a=-Math.PI/2+f*Math.PI*2; let ai=amp, al=1;
      if(isDrum && !off && pulseAt>=0){ const dt=since-f*curDur; ai=(dt>=0 && !reduce)?Math.max(0,1-dt*3):0; al=0.45+0.55*ai; }
      cx.globalAlpha=(off?0.18:sw)*al; cx.fillStyle=col; cx.beginPath(); cx.arc(C+Math.cos(a)*rr,C+Math.sin(a)*rr,(3.5+2.2*k+ai*4)*d,0,Math.PI*2); cx.fill(); });
    cx.globalAlpha=off?0.18:sw;
    if(curLines && curLines[i]!=null){ const c1=curLines[i], c0=(curPrev&&curPrev[i]!=null)?curPrev[i]:c1, u=reduce?1:Math.min(1,since/Math.min(0.22,0.6*curDur)), e=u*u*(3-2*u), f=(c0+(c1-c0)*e)/1200, a=-Math.PI/2+f*Math.PI*2; cx.strokeStyle=col; cx.lineWidth=2*d; cx.beginPath(); cx.arc(C+Math.cos(a)*rr,C+Math.sin(a)*rr,(12+amp*3)*d,0,Math.PI*2); cx.stroke(); }
    const la=-Math.PI/2+100/360*Math.PI*2; cx.fillStyle=col; cx.font='500 '+(11*d)+'px '+cs.getPropertyValue('--mono'); cx.fillText(r.id,C+Math.cos(la)*rr,C+Math.sin(la)*rr+4*d);
    cx.globalAlpha=1;
  });
  requestAnimationFrame(draw);
}
buildRows(); buildTable(); buildTP(); buildGrid(); buildStrip(); markSec(); showInfo(); requestAnimationFrame(draw);
</script>
