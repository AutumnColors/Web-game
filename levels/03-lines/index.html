<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lines</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#06111f;color:#e7edf5;font-family:system-ui,Arial;display:flex;justify-content:center;align-items:center;padding:18px}.app{width:min(96vw,530px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}.score{font-weight:750;font-size:19px}.controls{display:flex;align-items:center;gap:10px}button{font:inherit;cursor:pointer}#submit,#restart{border:0;border-radius:10px;padding:11px 17px;font-weight:750;background:#dce8f4;color:#091525}#restart{background:#25364b;color:#e5eef9;padding:11px 13px}.status{min-height:25px;text-align:right;font-size:14px;font-weight:700}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;background:#0c1b2d;padding:12px;border-radius:17px;box-shadow:0 12px 36px #0005}.cell{aspect-ratio:1;border-radius:10px;border:2px solid #1b3048;background:#14283f;display:grid;place-items:center;padding:0;transition:transform .12s,background .15s,border-color .15s}.cell:active{transform:scale(.94)}.cell.selected{border-color:#fff;background:#36516b}.dot{width:67%;height:67%;border-radius:50%;box-shadow:inset 0 -5px 9px #0003,0 2px 7px #0004}.blue{background:#32b9eb}.orange{background:#e6a52d}.black{background:#03060b;box-shadow:inset 0 0 0 2px #283446}.hint{margin-top:13px;color:#8c9bb0;text-align:center;font-size:12px}@media(max-width:430px){.board{gap:5px;padding:8px}.cell{border-radius:7px}.top{flex-wrap:wrap}.status{flex:1}}
.back{color:#a9bbcd;text-decoration:none;font-weight:700;padding:9px 12px;border-radius:10px;background:#ffffff12;white-space:nowrap}.back:hover{background:#ffffff22;color:#fff}
</style></head><body><main class="app"><div class="top"><a class="back" href="../../">← Levels</a><div class="score">Points: <span id="score">0</span></div><div class="controls"><span class="status" id="status"></span><button id="submit">Submit</button><button id="restart" title="New game">↻</button></div></div><div class="board" id="board" aria-label="Game board"></div><div class="hint">Select 3 blue or 5 orange in one straight line · Horizontal, vertical, or diagonal</div></main><script src="../../shared/progress.js"></script>
<script>
const LEVEL_ID='lines';
const N=8, BLUE='blue',ORANGE='orange',BLACK='black', directions=[[0,1],[1,0],[1,1],[1,-1]];let board=[],selected=new Set(),score=0;const $=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n);const index=(r,c)=>r*N+c;
function lines(b){let out=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dr,dc] of directions)for(const [color,len] of [[BLUE,3],[ORANGE,5]]){let a=[];for(let k=0;k<len;k++){let y=r+k*dr,x=c+k*dc;if(y<0||y>=N||x<0||x>=N||b[index(y,x)]!==color)break;a.push(index(y,x))}if(a.length===len)out.push(a)}return out}
function shufflePlayable(){let positions=[],values=[];board.forEach((v,i)=>{if(v!==BLACK){positions.push(i);values.push(v)}});for(let attempt=0;attempt<1500;attempt++){for(let i=values.length-1;i>0;i--){let j=rand(i+1);[values[i],values[j]]=[values[j],values[i]]}positions.forEach((p,i)=>board[p]=values[i]);if(lines(board).length)return true} // Construct a guaranteed match while preserving all counts and obstacles.
for(const [color,len] of [[BLUE,3],[ORANGE,5]]){const candidates=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dr,dc] of directions){let path=[];for(let k=0;k<len;k++){let y=r+k*dr,x=c+k*dc;if(y<0||y>=N||x<0||x>=N||board[index(y,x)]===BLACK)break;path.push(index(y,x))}if(path.length===len)candidates.push(path)}for(let j=candidates.length-1;j>0;j--){let k=rand(j+1);[candidates[j],candidates[k]]=[candidates[k],candidates[j]]}for(const path of candidates){const needed=path.filter(p=>board[p]!==color),donors=positions.filter(p=>!path.includes(p)&&board[p]===color);if(donors.length<needed.length)continue;needed.forEach((p,i)=>{let d=donors[i];[board[p],board[d]]=[board[d],board[p]]});return true}}return false}
function render(){const el=$('board');el.innerHTML='';board.forEach((v,i)=>{let cell=document.createElement('button');cell.className='cell'+(selected.has(i)?' selected':'');cell.setAttribute('aria-label',`${v} row ${Math.floor(i/N)+1} column ${i%N+1}`);cell.setAttribute('aria-pressed',selected.has(i));let dot=document.createElement('span');dot.className='dot '+v;cell.append(dot);cell.onclick=()=>{if(v===BLACK)return;selected.has(i)?selected.delete(i):selected.add(i);$('status').textContent='';render()};el.append(cell)});$('score').textContent=score}
function newGame(){score=0;selected.clear();$('status').textContent='';board=Array.from({length:N*N},()=>Math.random()<.13?BLACK:(Math.random()<.58?BLUE:ORANGE)); // Ensure at least one clear run is possible, with sufficient blue/orange tiles.
let tries=0;while(!shufflePlayable()&&tries++<100){board=Array.from({length:N*N},()=>Math.random()<.10?BLACK:(Math.random()<.58?BLUE:ORANGE))}render()}
$('submit').onclick=()=>{const valid=lines(board).some(a=>a.length===selected.size&&a.every(p=>selected.has(p)));if(!valid){$('status').textContent='Incorrect';$('status').style.color='#ff8585';return}const chosen=[...selected];score+=chosen.length;GameKit.best(LEVEL_ID,score);selected.clear();for(const i of chosen)board[i]=null;for(let i=0;i<board.length;i++)if(board[i]===null)board[i]=Math.random()<.58?BLUE:ORANGE;shufflePlayable();render();$('status').textContent='Correct';$('status').style.color='#75e2aa'};$('restart').onclick=newGame;GameKit.played(LEVEL_ID);newGame();
</script></body></html>
