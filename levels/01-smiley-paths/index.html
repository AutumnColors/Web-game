<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smiley Paths</title>
<style>
:root{color-scheme:dark;--bg:#081321;--tile:#14263a;--border:#30465c;--text:#f4f7fc;--muted:#a9bbcd;--accent:#79d4ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#18314c 0%,var(--bg) 60%);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text)}
main{max-width:850px;margin:0 auto;padding:16px 16px 48px}h1{font-size:clamp(1.8rem,5vw,2.7rem);text-align:center;margin:10px 0 5px;letter-spacing:.03em}.subtitle{text-align:center;color:var(--muted);margin:0 0 22px;font-size:.96rem}.toolbar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.score{font-weight:750;font-size:1.13rem}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{min-width:0;min-height:114px;border:2px solid var(--border);border-radius:16px;background:var(--tile);display:flex;justify-content:center;align-items:center;padding:12px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s;touch-action:manipulation}.tile:hover{border-color:#6689a8}.tile:focus-visible{outline:3px solid #fff;outline-offset:3px}.tile.selected{border-color:var(--accent);background:#24445c;box-shadow:0 0 0 2px #79d4ff35;transform:translateY(-2px)}.tile.empty{visibility:hidden;pointer-events:none}.faces{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px}.face{width:27px;height:27px;display:block;flex:none}.controls{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;margin:23px 0 8px}.btn{border:0;border-radius:12px;padding:13px 28px;background:#69caff;color:#061323;font-size:1rem;font-weight:800;cursor:pointer}.btn:active{transform:scale(.98)}.btn.secondary{background:#30465c;color:#fff;padding:11px 17px;font-size:.9rem}.feedback{min-width:95px;font-weight:800}.feedback.good{color:#81e9a1}.feedback.bad{color:#ff9b9b}.hint{text-align:center;color:var(--muted);font-size:.86rem;margin:13px auto 0;max-width:520px}.win{text-align:center;font-size:1.25rem;font-weight:750;color:#81e9a1;margin-top:16px}.hidden{display:none}@media(max-width:580px){main{padding:12px 10px 35px}.board{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{min-height:100px;padding:7px;border-radius:12px}.face{width:24px;height:24px}.faces{gap:3px}}@media(max-width:350px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.back{color:#a9bbcd;text-decoration:none;font-weight:700;padding:9px 12px;border-radius:10px;background:#ffffff12;white-space:nowrap}.back:hover{background:#ffffff22;color:#fff}
</style>
</head>
<body>
<main>
<div class="toolbar"><a class="back" href="../../">← Levels</a><span class="score" id="score">Score: 0</span><button id="submit" class="btn" type="button">Submit</button><span id="feedback" class="feedback" role="status" aria-live="polite"></span><button class="btn secondary" id="restart" type="button">New game</button></div>
<div id="board" class="board" aria-label="Smiley bricks"></div>
<div id="win" class="win hidden">All paths found! 🎉</div>
</main>
<script src="../../shared/progress.js"></script>
<script>
'use strict';
const LEVEL_ID='smiley-paths';
// Six leaves chosen from the LEFT subtree of the supplied graph.
// Each path lists actual graph node IDs from node 1 to its leaf.
// Nodes shared by paths are represented by a single brick.
const PATHS = [
  [1,3,7,14,26,40,51,57],
  [1,3,7,14,26,40,51,58],
  [1,3,7,15,27,41,52],
  [1,3,7,15,27,41,53],
  [1,3,8,16,28,42],
  [1,3,8,16,28,43]
];
const COLORS=['#ff7278','#ffb44d','#f4df63','#65dba0','#62baff','#c99afa'];
const allNodes=[...new Set(PATHS.flat())];
const nodeColors=new Map(allNodes.map(node=>[node,PATHS.flatMap((p,i)=>p.includes(node)?[i]:[])]));
const board=document.getElementById('board'),scoreEl=document.getElementById('score'),feedback=document.getElementById('feedback'),win=document.getElementById('win');
let completed=new Set(),selected=new Set(),order=[];
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function face(color){return `<svg class="face" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="${color}"/><circle cx="14" cy="16" r="2.4" fill="#192433"/><circle cx="26" cy="16" r="2.4" fill="#192433"/><path d="M11.5 23 Q20 34 28.5 23" fill="none" stroke="#192433" stroke-width="2.6" stroke-linecap="round"/></svg>`}
function activeNodes(){return new Set(PATHS.flatMap((p,i)=>completed.has(i)?[]:p))}
function render(){
 const active=activeNodes();
 for(const node of order){
   const tile=board.querySelector(`[data-node="${node}"]`);
   const visible=active.has(node);
   tile.classList.toggle('empty',!visible);
   tile.classList.toggle('selected',visible&&selected.has(node));
   tile.setAttribute('aria-pressed',String(visible&&selected.has(node)));
   tile.disabled=!visible;
 }
 scoreEl.textContent=`Score: ${completed.size}`;
 GameKit.best(LEVEL_ID,completed.size);if(completed.size===PATHS.length)GameKit.complete(LEVEL_ID);
 win.classList.toggle('hidden',completed.size!==PATHS.length);
 document.getElementById('submit').disabled=completed.size===PATHS.length;
}
function setFeedback(message,correct){feedback.textContent=message;feedback.className='feedback '+(correct?'good':'bad')}
function newGame(){
 completed=new Set();selected=new Set();order=shuffle([...allNodes]);board.innerHTML='';
 for(const node of order){
   const tile=document.createElement('button');tile.type='button';tile.className='tile';tile.dataset.node=node;
   const colors=nodeColors.get(node);tile.innerHTML=`<span class="faces">${colors.map(i=>face(COLORS[i])).join('')}</span>`;
   tile.setAttribute('aria-label',`${colors.length} smiley faces`);
   tile.addEventListener('click',()=>{if(!activeNodes().has(node))return;selected.has(node)?selected.delete(node):selected.add(node);setFeedback('',false);render()});
   board.appendChild(tile);
 }
 setFeedback('',false);render();
}
function submit(){
 if(completed.size===PATHS.length)return;
 const match=PATHS.findIndex((path,i)=>!completed.has(i)&&selected.size===path.length&&path.every(node=>selected.has(node)));
 if(match<0){setFeedback('Incorrect',false);return}
 completed.add(match);selected.clear();setFeedback('Correct!',true);render();
}
document.getElementById('submit').addEventListener('click',submit);
document.getElementById('restart').addEventListener('click',newGame);
GameKit.played(LEVEL_ID);
newGame();
</script>
</body>
</html>
